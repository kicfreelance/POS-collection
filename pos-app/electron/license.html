<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>POS — Licence</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 2rem;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7; color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1f22; color: #eaeaea; }
        input { background: #2b2d31; color: #eaeaea; border-color: #444; }
        .card { background: #26272b; border-color: #383a40; }
      }
      h1 { font-size: 1.15rem; margin: 0 0 .25rem; }
      p.sub { margin: 0 0 1.25rem; opacity: .7; }
      .card { background: #fff; border: 1px solid #e2e2e5; border-radius: 10px; padding: 1.25rem; }
      label { display: block; font-weight: 600; margin-bottom: .4rem; }
      input {
        width: 100%; padding: .6rem .7rem; font-size: 1rem; letter-spacing: .06em;
        border: 1px solid #cfcfd4; border-radius: 8px; text-transform: uppercase;
      }
      button {
        margin-top: .9rem; width: 100%; padding: .65rem; font-size: 1rem; font-weight: 600;
        border: 0; border-radius: 8px; background: #0b5fff; color: #fff; cursor: pointer;
      }
      button.secondary { background: transparent; color: inherit; border: 1px solid #cfcfd4; }
      button:disabled { opacity: .55; cursor: default; }
      .msg { margin-top: .9rem; padding: .6rem .7rem; border-radius: 8px; font-size: .92rem; display: none; }
      .msg.err { display: block; background: #fdecec; color: #a1180f; }
      .msg.ok { display: block; background: #e7f6ec; color: #14683a; }
      @media (prefers-color-scheme: dark) {
        .msg.err { background: #3a1f1d; color: #ff9a8f; }
        .msg.ok { background: #1e3a2a; color: #8fe0ac; }
      }
      .fp { margin-top: 1rem; font-size: .78rem; opacity: .55; word-break: break-all; }
      .row { display: flex; gap: .6rem; }
      .row button { margin-top: 0; }
    </style>
  </head>
  <body>
    <h1>Activate this POS installation</h1>
    <p class="sub">Enter the licence key you were given. Needs an internet connection once.</p>

    <div class="card" id="activateCard">
      <label for="key">Licence key</label>
      <input id="key" placeholder="PST-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" spellcheck="false" />
      <button id="activateBtn">Activate</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card" id="manageCard" style="display:none; margin-top: 1rem;">
      <label>This computer is licensed</label>
      <div id="entInfo" style="opacity:.75; font-size:.9rem;"></div>
      <button class="secondary" id="moveBtn">Deactivate on this PC…</button>
      <button id="continueBtn">Continue to POS</button>
      <div class="msg" id="msg2"></div>
    </div>

    <div class="row" style="margin-top: 1rem;">
      <button class="secondary" id="quitBtn">Quit</button>
    </div>

    <div class="fp" id="fp"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const api = window.license;

      function showEnt(e) {
        if (!e) return;
        const exp = e.expiresAt ? new Date(e.expiresAt * 1000).toISOString().slice(0, 10) : "perpetual";
        $("entInfo").textContent = `Edition: ${e.edition} · Seats: ${e.seatLimit} · Expires: ${exp}`;
      }

      async function refresh() {
        const st = await api.getState();
        $("fp").textContent = "Machine ID: " + st.fingerprint;
        const licensed = st.state === "ok" || st.state === "grace";
        $("activateCard").style.display = licensed ? "none" : "block";
        $("manageCard").style.display = licensed ? "block" : "none";
        if (licensed) showEnt(st.entitlement);
        if (st.state === "grace") {
          $("msg2").className = "msg err";
          $("msg2").textContent = "Licence needs to reconnect to the server soon (reason: " + (st.reason || "") + ").";
        }
      }

      $("activateBtn").onclick = async () => {
        const btn = $("activateBtn");
        const m = $("msg");
        m.className = "msg";
        btn.disabled = true;
        btn.textContent = "Activating…";
        try {
          const r = await api.activate($("key").value);
          if (r.ok) {
            m.className = "msg ok";
            m.textContent = "Activated. Starting POS…";
            setTimeout(() => api.continue(), 600);
          } else {
            m.className = "msg err";
            m.textContent = r.detail || r.error || "Activation failed.";
          }
        } finally {
          btn.disabled = false;
          btn.textContent = "Activate";
          refresh();
        }
      };

      $("moveBtn").onclick = async () => {
        if (!confirm("Deactivate on this PC? POS will stop working here until re-activated. Note: this does NOT free up a licence slot - ask your vendor to move the licence to a new machine.")) return;
        const r = await api.release();
        const m = $("msg2");
        if (r.ok) {
          m.className = "msg ok";
          m.textContent = "Deactivated on this PC. Contact your vendor to activate on a different machine.";
        } else {
          m.className = "msg err";
          m.textContent = "Release failed: " + (r.error || "unknown");
        }
        refresh();
      };

      $("continueBtn").onclick = () => api.continue();
      $("quitBtn").onclick = () => api.quit();

      $("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("activateBtn").click(); });

      refresh();
    </script>
  </body>
</html>
